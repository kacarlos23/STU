name: stu

services:
  operations-init:
    image: alpine:3.23
    command: ["sh", "-c", "chown -R 1654:1654 /operations && chmod 770 /operations"]
    volumes:
      - stu-operations:/operations
    restart: "no"

  database:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: ${STU_POSTGRES_DB:-stu}
      POSTGRES_USER: ${STU_POSTGRES_USER:-stu}
      POSTGRES_PASSWORD: ${STU_POSTGRES_PASSWORD:?Define STU_POSTGRES_PASSWORD before starting STU}
    ports:
      - "127.0.0.1:${STU_POSTGRES_PORT:-55432}:5432"
    volumes:
      - stu-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STU_POSTGRES_USER:-stu} -d ${STU_POSTGRES_DB:-stu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/STU.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__StuDatabase: ${STU_DB_CONNECTION:?Define STU_DB_CONNECTION before starting STU}
      Database__ApplyMigrations: "true"
      Database__MaximumPoolSize: "80"
      Operations__StoragePath: /operations
      Cors__AllowedOrigins__0: http://localhost:${STU_GATEWAY_PORT:-8088}
    ports:
      - "127.0.0.1:${STU_API_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      operations-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - stu-operations:/operations

  worker:
    build:
      context: .
      dockerfile: src/STU.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__StuDatabase: ${STU_DB_CONNECTION:?Define STU_DB_CONNECTION before starting STU}
      Database__MaximumPoolSize: "10"
      Operations__StoragePath: /operations
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
    depends_on:
      database:
        condition: service_healthy
      operations-init:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - stu-operations:/operations

  martin:
    image: ghcr.io/maplibre/martin:1.13.0
    command: ["--config", "/config/martin.yaml"]
    volumes:
      - ./infra/martin/martin.yaml:/config/martin.yaml:ro
      - ./infra/martin/tiles:/tiles:ro
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      args:
        STU_WEB_WORKSPACE: stu-app
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
      args:
        STU_WEB_WORKSPACE: stu-admin
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "127.0.0.1:${STU_GATEWAY_PORT:-8088}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - app
      - admin
      - martin
    restart: unless-stopped

volumes:
  stu-postgres:
  stu-operations:
