events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;
    server_tokens off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self' data: https://demotiles.maplibre.org; connect-src 'self' https://tile.openstreetmap.org https://demotiles.maplibre.org; worker-src 'self' blob:" always;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $stu_forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    upstream stu_api {
        zone stu_api 64k;
        server api:8080 resolve;
    }

    upstream stu_app {
        zone stu_app 64k;
        server app:80 resolve;
    }

    upstream stu_admin {
        zone stu_admin 64k;
        server admin:80 resolve;
    }

    upstream stu_basemap {
        zone stu_basemap 64k;
        server martin:3000 resolve;
    }

    server {
        listen 80;
        server_name stu.laudaapp.com localhost _;

        location /api/ {
            proxy_pass http://stu_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $stu_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_hide_header Cache-Control;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Frame-Options;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self' data: https://demotiles.maplibre.org; connect-src 'self' https://tile.openstreetmap.org https://demotiles.maplibre.org; worker-src 'self' blob:" always;
        }

        location /health/ {
            proxy_pass http://stu_api;
            proxy_set_header Host $host;
            proxy_hide_header Strict-Transport-Security;
        }

        location /basemap/ {
            proxy_pass http://stu_basemap/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://stu_app;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $stu_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    server {
        listen 80;
        server_name admin.localhost stu-admin.laudaapp.com;

        location /api/ {
            proxy_pass http://stu_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $stu_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_hide_header Cache-Control;
            proxy_hide_header Strict-Transport-Security;
            proxy_hide_header X-Frame-Options;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self' data: https://demotiles.maplibre.org; connect-src 'self' https://tile.openstreetmap.org https://demotiles.maplibre.org; worker-src 'self' blob:" always;
        }

        location / {
            proxy_pass http://stu_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $stu_forwarded_proto;
            proxy_set_header X-Forwarded-Host $host;
        }
    }
}
